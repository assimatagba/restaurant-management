name: CI backend

on:
  push:
    paths:
      - 'backend/**'
      - 'tests/**/*.py'
      - 'scripts/backend_dashboard.py'
      - 'scripts/report_templates/**'
      - 'scripts/check_backend_report.cjs'
      - 'scripts/ci_run.py'
      - 'scripts/sonar_report.py'
      - 'scripts/prepare_sonar.py'
      - 'scripts/manage.py'
      - '.coveragerc'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**/*.py'
      - 'scripts/backend_dashboard.py'
      - 'scripts/report_templates/**'
      - 'scripts/check_backend_report.cjs'
      - 'scripts/ci_run.py'
      - 'scripts/sonar_report.py'
      - 'scripts/prepare_sonar.py'
      - 'scripts/manage.py'
      - '.coveragerc'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Unit tests, regression tests and build
        run: python scripts/ci_run.py --project backend

      - name: Check SonarQube configuration
        id: sonar-config
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_BACKEND_PROJECT_KEY }}
        run: python scripts/prepare_sonar.py --project backend

      - name: SonarQube analysis and Quality Gate
        id: sonar
        if: ${{ !cancelled() && steps.sonar-config.outputs.enabled == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_ACTIONS: ${{ env.SONAR_TEMPORARY != 'true' }}
        with:
          projectBaseDir: .
          args: >
            -Dproject.settings=backend/sonar-project.properties
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Export SonarQube report
        if: always()
        env:
          SONAR_OUTCOME: ${{ steps.sonar.outcome }}
          CI_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: python scripts/sonar_report.py --project backend

      - name: Generate final project summary
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: python scripts/ci_run.py --project backend --report-only

      - name: Stop temporary SonarQube
        if: ${{ always() }}
        run: |
          if docker container inspect ci-sonarqube > /dev/null 2>&1; then
            docker logs ci-sonarqube > reports/backend/sonarqube-server.log 2>&1
            docker rm -f ci-sonarqube
          fi

      - name: Publish reports even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: reports/backend/
          if-no-files-found: error
          retention-days: 30

      - name: Publish build package
        if: ${{ !cancelled() && hashFiles('dist/backend.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: dist/backend.zip
          retention-days: 14
